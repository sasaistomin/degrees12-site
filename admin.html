<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админка — DEGREES° 12</title>
<style>
/* ===== Стили админки (цвета те же, что на сайте) ===== */
:root{--esp:#24160e;--moc:#4a3223;--lat:#b8946a;--oat:#e9dcc6;--foam:#f6efe3}
*{box-sizing:border-box}
body{margin:0;background:var(--foam);color:var(--esp);font-family:system-ui,Arial,sans-serif;line-height:1.45}
header{background:var(--esp);color:var(--foam);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px;letter-spacing:.04em}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{margin:28px 0 12px}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--moc);color:var(--foam)}
button.main{background:var(--lat);color:var(--esp);font-weight:700}
button.ghost{background:transparent;border:1px solid var(--moc);color:var(--moc)}
button.danger{background:#8a2b1c}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:10px;border:1px solid #cdbb9b;border-radius:8px;background:#fff}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.box{background:#fff;border:1px solid #e0d2b8;border-radius:12px;padding:18px}
.login{max-width:360px;margin:60px auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--oat);border-radius:10px;padding:12px}.stat b{display:block;font-size:26px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes label{margin:0;font-weight:500;border:1px solid #cdbb9b;border-radius:6px;padding:5px 10px;cursor:pointer;background:#fff}
.sizes input{display:none}.sizes label:has(input:checked){background:var(--moc);color:#fff;border-color:var(--moc)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee3cf;flex-wrap:wrap}
.row img,.ph{width:64px;height:64px;object-fit:contain;background:var(--oat);border-radius:8px;flex:none}
.row .info{flex:1;min-width:170px}.row small{opacity:.7}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--lat);margin-left:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{padding:6px 10px;font-size:14px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cat{padding:6px 12px;border-radius:99px;display:flex;gap:8px;align-items:center}.cat button{padding:0 6px;background:rgba(0,0,0,.25)}
#prev{max-width:160px;max-height:160px;margin-top:8px;display:block;border-radius:8px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--esp);color:#fff;padding:10px 18px;border-radius:99px;display:none}
@media(max-width:640px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- ШАПКА -->
<header><b>DEGREES° 12 — админка</b><span><a href="/" style="color:#e9dcc6">на сайт</a> <button id="out" style="display:none">Выйти</button></span></header>

<!-- ВХОД: показывается, пока вы не вошли -->
<div id="login" class="box login">
  <h3 style="margin-top:0">Вход</h3>
  <label>Логин</label><input type="text" id="em" autocomplete="username">
  <label>Пароль</label><input type="password" id="pw" autocomplete="current-password">
  <p><button class="main" id="go">Войти</button></p>
</div>

<!-- ПАНЕЛЬ: показывается после входа -->
<main id="app" style="display:none">
  <h2 style="margin-top:0">Что у вас есть</h2>
  <div class="stats" id="stats"></div>

  <h2>Товары <button class="main" id="add" style="float:right">+ Добавить товар</button></h2>
  <!-- Форма добавления / редактирования -->
  <div class="box" id="formBox" style="display:none">
    <div class="form">
      <div class="full"><label>Название (бренд + модель)</label><input type="text" id="fName"></div>
      <div><label>Категория</label><select id="fCat"></select></div>
      <div><label>Цена</label><input type="number" id="fPrice" min="0"></div>
      <div class="full"><label>Размеры</label><div class="sizes" id="fSizes"></div>
        <input type="text" id="fExtra" placeholder="Другие размеры через запятую, например: 46, One size" style="margin-top:8px"></div>
      <div class="full"><label>Фото (лучше PNG без фона)</label><input type="file" id="fFile" accept="image/*">
        <img id="prev" alt="" style="display:none"></div>
    </div>
    <p><button class="main" id="save">Сохранить</button> <button class="ghost" id="cancel">Отмена</button></p>
  </div>
  <div id="list"></div>

  <h2>Категории</h2>
  <div class="cats" id="cats"></div>
  <div class="box"><div class="form">
    <div><label>Название</label><input type="text" id="cName"></div>
    <div><label>Цвет плитки / цвет текста</label><input type="color" id="cColor" value="#4a3223"> <input type="color" id="cText" value="#f6efe3"></div>
  </div><p><button class="main" id="cAdd">Добавить категорию</button></p></div>
</main>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ===== Логика админки ===== */
var $ = function (i) { return document.getElementById(i); };
if (!SUPABASE_URL || !SUPABASE_KEY) document.body.insertAdjacentHTML('afterbegin', '<p style="padding:20px;background:#fdd">Заполните config.js (адрес и ключ Supabase), см. ФУНКЦИОНАЛ.md</p>');
var sb = supabase.createClient(SUPABASE_URL || 'http://x', SUPABASE_KEY || 'x');   // подключение (config.js)
var products = [], cats = [], editId = null, photoUrl = null;
var SIZES = ['XS','S','M','L','XL','XXL','38','39','40','41','42','43','44','45','46'];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function say(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2500); }

// --- Вход / выход ---
// Supabase требует почту, поэтому логин превращается во внутренний адрес:
// «Istomin Sasha M» -> istomin.sasha.m@degrees12.shop (это тот же адрес, что в supabase.sql)
function toEmail(login) { return login.trim().toLowerCase().replace(/\s+/g, '.') + '@degrees12.shop'; }
// Фото из старых товаров лежат в папке сайта (photos/...), для админки делаем путь абсолютным
function src(u) { return /^(https?:)?\//.test(u) ? u : '/' + u; }
async function check() {
  var s = (await sb.auth.getSession()).data.session;
  $('login').style.display = s ? 'none' : 'block';
  $('app').style.display = s ? 'block' : 'none';
  $('out').style.display = s ? 'inline-block' : 'none';
  if (s) load();
}
$('go').onclick = async function () {
  var r = await sb.auth.signInWithPassword({ email: toEmail($('em').value), password: $('pw').value });
  if (r.error) say('Ошибка: ' + r.error.message); else check();
};
$('out').onclick = async function () { await sb.auth.signOut(); check(); };

// --- Загрузка данных и отрисовка ---
async function load() {
  var r = await Promise.all([sb.from('categories').select('*').order('position'), sb.from('products').select('*').order('created_at', { ascending: false })]);
  cats = r[0].data || []; products = r[1].data || [];
  var sold = products.filter(function (p) { return p.sold; }).length, hid = products.filter(function (p) { return p.hidden; }).length;
  $('stats').innerHTML = [['Всего', products.length], ['В наличии', products.length - sold - hid], ['Продано', sold], ['Скрыто', hid], ['Категорий', cats.length]]
    .map(function (x) { return '<div class="stat"><b>' + x[1] + '</b>' + x[0] + '</div>'; }).join('');
  $('cats').innerHTML = cats.map(function (c) {
    return '<span class="cat" style="background:' + c.color + ';color:' + c.text_color + '">' + esc(c.name) + '<button data-delcat="' + c.id + '">×</button></span>'; }).join('');
  $('fCat').innerHTML = cats.map(function (c) { return '<option>' + esc(c.name) + '</option>'; }).join('');
  $('list').innerHTML = products.map(function (p) {
    return '<div class="row">' + (p.photo ? '<img src="' + esc(src(p.photo)) + '" alt="">' : '<div class="ph"></div>') +
      '<div class="info"><b>' + esc(p.name) + '</b>' + (p.sold ? '<span class="tag">Продано</span>' : '') + (p.hidden ? '<span class="tag">Скрыт</span>' : '') +
      '<br><small>' + esc(p.category) + ' · ' + esc((p.sizes || []).join(', ')) + ' · ' + p.price + '</small></div>' +
      '<div class="acts"><button data-sold="' + p.id + '">' + (p.sold ? 'Вернуть' : 'Продано') + '</button>' +
      '<button data-hide="' + p.id + '">' + (p.hidden ? 'Показать' : 'Скрыть') + '</button>' +
      '<button class="ghost" data-edit="' + p.id + '">Изменить</button><button class="danger" data-del="' + p.id + '">Удалить</button></div></div>';
  }).join('') || '<p>Товаров пока нет.</p>';
}

// --- Форма товара ---
function openForm(p) {
  editId = p ? p.id : null; photoUrl = p ? p.photo : null;
  $('fName').value = p ? p.name : ''; $('fPrice').value = p ? p.price : '';
  if (p) $('fCat').value = p.category;
  var have = p ? p.sizes || [] : [];
  $('fSizes').innerHTML = SIZES.map(function (s) { return '<label><input type="checkbox" value="' + s + '"' + (have.indexOf(s) > -1 ? ' checked' : '') + '>' + s + '</label>'; }).join('');
  $('fExtra').value = have.filter(function (s) { return SIZES.indexOf(s) < 0; }).join(', ');
  $('fFile').value = ''; $('prev').style.display = photoUrl ? 'block' : 'none'; $('prev').src = photoUrl ? src(photoUrl) : '';
  $('formBox').style.display = 'block'; $('formBox').scrollIntoView({ behavior: 'smooth' });
}
$('add').onclick = function () { openForm(null); };
$('cancel').onclick = function () { $('formBox').style.display = 'none'; };

// Загрузка фото: уменьшаем до 1200px и отправляем в хранилище Supabase
$('fFile').onchange = async function (e) {
  var f = e.target.files[0]; if (!f) return;
  say('Загружаю фото…');
  var img = await createImageBitmap(f), k = Math.min(1, 1200 / Math.max(img.width, img.height));
  var cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  var png = f.type === 'image/png';               // PNG оставляем PNG (прозрачный фон сохраняется)
  var blob = await new Promise(function (r) { cv.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.88); });
  var name = Date.now() + '-' + Math.random().toString(36).slice(2, 7) + (png ? '.png' : '.jpg');
  var up = await sb.storage.from('photos').upload(name, blob, { contentType: blob.type });
  if (up.error) return say('Ошибка загрузки: ' + up.error.message);
  photoUrl = sb.storage.from('photos').getPublicUrl(name).data.publicUrl;
  $('prev').src = photoUrl; $('prev').style.display = 'block'; say('Фото загружено');
};

// Сохранить товар (новый или изменённый)
$('save').onclick = async function () {
  var sizes = Array.prototype.map.call($('fSizes').querySelectorAll('input:checked'), function (i) { return i.value; })
    .concat($('fExtra').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean));
  if (!$('fName').value.trim()) return say('Введите название');
  var row = { name: $('fName').value.trim(), category: $('fCat').value, price: Number($('fPrice').value) || 0, sizes: sizes, photo: photoUrl };
  var r = editId ? await sb.from('products').update(row).eq('id', editId) : await sb.from('products').insert(row);
  if (r.error) return say('Ошибка: ' + r.error.message);
  $('formBox').style.display = 'none'; say('Сохранено'); load();
};

// --- Кнопки в списке и категории ---
document.addEventListener('click', async function (e) {
  var d = e.target.dataset, p;
  if (d.sold) { p = products.find(function (x) { return x.id === d.sold; }); await sb.from('products').update({ sold: !p.sold }).eq('id', p.id); load(); }
  if (d.hide) { p = products.find(function (x) { return x.id === d.hide; }); await sb.from('products').update({ hidden: !p.hidden }).eq('id', p.id); load(); }
  if (d.edit) openForm(products.find(function (x) { return x.id === d.edit; }));
  if (d.del && confirm('Удалить товар насовсем?')) { await sb.from('products').delete().eq('id', d.del); load(); }
  if (d.delcat && confirm('Удалить категорию? Товары останутся, но без плитки категории.')) { await sb.from('categories').delete().eq('id', d.delcat); load(); }
});
$('cAdd').onclick = async function () {
  var n = $('cName').value.trim(); if (!n) return say('Введите название');
  var r = await sb.from('categories').insert({ name: n, color: $('cColor').value, text_color: $('cText').value, position: cats.length + 1 });
  if (r.error) return say('Ошибка: ' + r.error.message);
  $('cName').value = ''; load();
};

check();
</script>
</body>
</html>
